{% extends "base.html" %}
{% block title %}Alterar Senha{% endblock %}
{% block page_title %}Alterar Senha{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

      <div class="mb-5">
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Senha atual</label>
        <input type="password" name="current_password" required
               class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div class="mb-5">
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Nova senha</label>
        <input type="password" name="new_password" required minlength="6"
               class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div class="mb-6">
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Confirmar nova senha</label>
        <input type="password" name="confirm_password" required minlength="6"
               class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <button type="submit"
              class="w-full py-3 bg-blue-700 hover:bg-blue-800 text-white font-semibold rounded-lg transition-colors text-sm">
        Alterar Senha
      </button>
    </form>
  </div>
</div>
{% endblock %}
