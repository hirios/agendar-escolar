{% extends "base.html" %}
{% block title %}{{ 'Editar' if action == 'edit' else 'Nova' }} Turma{% endblock %}
{% block page_title %}{{ 'Editar' if action == 'edit' else 'Nova' }} Turma{% endblock %}

{% block content %}
<div class="max-w-xl">
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
    <form method="POST" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="grid grid-cols-2 gap-5 mb-5">
        <div class="col-span-2">
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Nome da Turma *</label>
          <input type="text" name="name" required value="{{ class_.name if class_ else '' }}" placeholder="ex: 9A, 1EM-B"
                 class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Série/Ano</label>
          <input type="text" name="grade_level" value="{{ class_.grade_level if class_ else '' }}" placeholder="ex: 9º Ano EF"
                 class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Turno *</label>
          <select name="shift" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="morning" {{ 'selected' if class_ and class_.shift == 'morning' }}>Manhã</option>
            <option value="afternoon" {{ 'selected' if class_ and class_.shift == 'afternoon' }}>Tarde</option>
            <option value="evening" {{ 'selected' if class_ and class_.shift == 'evening' }}>Noite</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Sala</label>
          <input type="text" name="room" value="{{ class_.room if class_ else '' }}"
                 class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Máx. alunos</label>
          <input type="number" name="max_students" value="{{ class_.max_students if class_ else 40 }}" min="1" max="100"
                 class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div class="col-span-2">
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Ano Letivo *</label>
          <select name="school_year_id" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            {% for sy in school_years %}
            <option value="{{ sy.id }}" {{ 'selected' if class_ and class_.school_year_id == sy.id or sy.is_active }}>{{ sy.name }}{{ ' (Ativo)' if sy.is_active }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="flex gap-3">
        <button type="submit" class="px-6 py-2.5 bg-cyan-600 hover:bg-cyan-700 text-white font-semibold text-sm rounded-lg transition-colors">
          {{ 'Salvar' if action == 'edit' else 'Criar Turma' }}
        </button>
        <a href="{{ url_for('director.class_list') }}" class="px-6 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg transition-colors">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
