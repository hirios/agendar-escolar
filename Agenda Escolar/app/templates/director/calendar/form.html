{% extends "base.html" %}
{% block title %}Novo Evento{% endblock %}
{% block page_title %}Novo Evento no Calendário{% endblock %}

{% block content %}
<div class="max-w-xl">
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="mb-5">
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Título *</label>
        <input type="text" name="title" required
               class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div class="grid grid-cols-2 gap-4 mb-5">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Data *</label>
          <input type="date" name="event_date" required
                 class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Data fim</label>
          <input type="date" name="end_date"
                 class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4 mb-5">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Tipo</label>
          <select name="type" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="event">Evento</option>
            <option value="holiday">Feriado</option>
            <option value="exam">Prova/Avaliação</option>
            <option value="meeting">Reunião</option>
            <option value="deadline">Prazo</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Ano Letivo *</label>
          <select name="school_year_id" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            {% for sy in school_years %}
            <option value="{{ sy.id }}" {{ 'selected' if sy.is_active }}>{{ sy.name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="mb-6">
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Descrição</label>
        <textarea name="description" rows="3"
                  class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
      </div>
      <div class="flex gap-3">
        <button type="submit" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-lg transition-colors">Adicionar Evento</button>
        <a href="{{ url_for('director.calendar') }}" class="px-6 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg transition-colors">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
