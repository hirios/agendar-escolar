{% extends "base.html" %}
{% block title %}{{ 'Editar' if action == 'edit' else 'Nova' }} Disciplina{% endblock %}
{% block page_title %}{{ 'Editar' if action == 'edit' else 'Nova' }} Disciplina{% endblock %}

{% block content %}
<div class="max-w-md">
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="mb-5">
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Nome *</label>
        <input type="text" name="name" required value="{{ subject.name if subject else '' }}"
               class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div class="mb-5">
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Código *</label>
        <input type="text" name="code" required value="{{ subject.code if subject else '' }}" placeholder="ex: MAT, PORT"
               class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono uppercase" />
      </div>
      <div class="mb-5">
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Carga horária (h)</label>
        <input type="number" name="workload_hours" value="{{ subject.workload_hours if subject else '' }}" min="1"
               class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div class="mb-6">
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Descrição</label>
        <textarea name="description" rows="3"
                  class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none">{{ subject.description if subject else '' }}</textarea>
      </div>
      <div class="flex gap-3">
        <button type="submit" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm rounded-lg transition-colors">Salvar</button>
        <a href="{{ url_for('director.subject_list') }}" class="px-6 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg transition-colors">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
