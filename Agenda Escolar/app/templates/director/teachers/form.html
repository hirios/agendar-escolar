{% extends "base.html" %}
{% block title %}{{ 'Editar' if action == 'edit' else 'Novo' }} Professor{% endblock %}
{% block page_title %}{{ 'Editar' if action == 'edit' else 'Cadastrar' }} Professor{% endblock %}

{% block content %}
<div class="max-w-xl">
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
    <form method="POST" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="mb-5">
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Nome completo *</label>
        <input type="text" name="name" required value="{{ teacher.name if teacher else '' }}"
               class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      {% if action == 'new' %}
      <div class="mb-5">
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Email *</label>
        <input type="email" name="email" required
               class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div class="mb-6">
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Senha inicial</label>
        <input type="text" name="password" value="Escola@2025"
               class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      {% endif %}
      <div class="flex gap-3">
        <button type="submit" class="px-6 py-2.5 bg-violet-600 hover:bg-violet-700 text-white font-semibold text-sm rounded-lg transition-colors">
          {{ 'Salvar' if action == 'edit' else 'Cadastrar' }}
        </button>
        <a href="{{ url_for('director.teacher_list') }}" class="px-6 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg transition-colors">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
