{% extends "base.html" %}
{% block title %}{{ 'Editar' if action == 'edit' else 'Nova' }} Atividade{% endblock %}
{% block page_title %}{{ 'Editar' if action == 'edit' else 'Nova' }} Atividade{% endblock %}

{% block content %}
<div class="max-w-xl">
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="mb-5">
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Título *</label>
        <input type="text" name="title" required value="{{ assignment.title if assignment else '' }}"
               class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div class="grid grid-cols-2 gap-4 mb-5">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Turma/Disciplina *</label>
          <select name="class_subject_id" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            {% for cs in class_subjects %}
            <option value="{{ cs.id }}" {{ 'selected' if assignment and assignment.class_subject_id == cs.id }}>
              {{ cs.subject.name }} — {{ cs.class_.name }}
            </option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Tipo</label>
          <select name="type" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="homework" {{ 'selected' if assignment and assignment.type == 'homework' }}>Tarefa</option>
            <option value="project" {{ 'selected' if assignment and assignment.type == 'project' }}>Projeto</option>
            <option value="test" {{ 'selected' if assignment and assignment.type == 'test' }}>Avaliação</option>
            <option value="activity" {{ 'selected' if assignment and assignment.type == 'activity' }}>Atividade</option>
          </select>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4 mb-5">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Prazo de entrega</label>
          <input type="datetime-local" name="due_date"
                 value="{{ assignment.due_date.strftime('%Y-%m-%dT%H:%M') if assignment and assignment.due_date else '' }}"
                 class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Nota máxima</label>
          <input type="number" name="max_score" min="0" step="0.5"
                 value="{{ assignment.max_score if assignment else 10 }}"
                 class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
      </div>
      <div class="mb-6">
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Descrição</label>
        <textarea name="description" rows="4"
                  class="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none">{{ assignment.description if assignment else '' }}</textarea>
      </div>
      <div class="flex gap-3">
        <button type="submit" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-lg transition-colors">Salvar</button>
        <a href="{{ url_for('teacher.assignment_list') }}" class="px-6 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg transition-colors">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
